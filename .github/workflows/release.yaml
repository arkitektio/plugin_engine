name: Release

# Every push to main is tested and published. semantic-release reads the commits since
# the last release (https://www.conventionalcommits.org): if a `fix:` or a `feat:` is among
# them it raises the app's version in app.py, commits and tags that (v1.2.3), and the
# commit is published as that release. Any other push publishes the latest build of the
# main channel.
#
# A version tag pushed by hand (vX.Y.Z) is published as that release too, without
# semantic-release. It is the way out when semantic-release could commit a version but
# not push its tag: push the tag yourself. A tag semantic-release pushes starts no run of
# its own (GitHub never does for the workflow's token), so nothing is published twice.
on:
  push:
    branches: [main]
    tags: ["v*"]

# One release at a time: the next push waits for the version this one may commit.
concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # To push the version's commit and tag, and to create the GitHub release.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history, and its tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # Before a version is cut: a tag is not taken back when a test fails after it.
      - name: Test
        run: uv run pytest
      - name: Version
        id: version
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from "python-semantic-release>=10,<11" semantic-release version
      - uses: arkitektio/arkitekt/ci/github@v6.7.1
        with:
          target: app
          # The commit semantic-release tagged is that release, not a build of the branch.
          # On a tag's own push it is empty: the tag is the release.
          release: ${{ steps.version.outputs.released }}
