[project]
name = "plugin-engine"
version = "0.1.0"
description = "The plugin engine: runs approved kabinet releases as Docker containers"
readme = "README.md"
authors = [
    { name = "Johannes Roos", email = "jhnnsrs@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkitekt[all]>=8.0.0",
    # Verifies the signed challenges of a hub that pins its services' keys. Optional in
    # fakts (not every platform has a wheel); this image's platforms all do.
    "fakts[crypto]>=6.0.1",
    # Pages through a backend's pods (MyPods) and reads a pod that may be gone (myPodAt);
    # 5.4: REQUEST_APPROVAL, the demand auto_install looks for among its callers.
    "kabinet>=5.4.0",
    # 9.1: ImplementationAgentFilter.caller_of, how auto_install finds its callers.
    "rekuest>=9.1.0",
    # 4.7.3: a call to a chosen implementation (the caller's own agent) goes to it.
    "arkitekt-runtime>=5.1.0",
    "docker",
]

# The app is app.py, not a package: the image copies the project and runs that module.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not hub'"

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false
